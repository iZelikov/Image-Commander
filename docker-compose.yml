services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  app:
    build:
      context: ./back
      dockerfile: Dockerfile
#    ports:
#      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./back:/app
      - ./logs:/logs
      - ./images:/images
    restart: unless-stopped
    networks:
      - backend
      - frontend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./images:/usr/share/nginx/images
      - ./logs:/var/log/nginx
#    restart: unless-stopped
    depends_on:
      - app
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  backend:
  frontend:
