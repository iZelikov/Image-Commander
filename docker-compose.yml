services:
  postgres:
    image: postgres:15-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./logs/postgresql:/var/log/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  app:
    build:
      context: ./back
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://$POSTGRES_USER:$POSTGRES_PASSWORD@postgres:5432/$POSTGRES_DB
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./back:/app
      - ./logs/app:/logs
      - ./images:/images
    restart: unless-stopped
    networks:
      - backend
      - frontend

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./images:/usr/share/nginx/images:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
      - adminer
    networks:
      - frontend
      - backend
    restart: unless-stopped

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DEFAULT_USERNAME: ${POSTGRES_USER}
      ADMINER_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
      ADMINER_DEFAULT_DATABASE: ${POSTGRES_DB}
      ADMINER_PLUGINS: tables-filter tinymce
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

  backup:
    image: prodrigestivill/postgres-backup-local:latest
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}

      # Расписание: каждый день в 2:00
      SCHEDULE: "0 2 * * *"

      # Хранение: 7 дней, 4 недели, 6 месяцев
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6

      # Дополнительные опции pg_dump
      POSTGRES_EXTRA_OPTS: "--clean --if-exists --no-owner --no-privileges"

      # Формат: plain (SQL), можно также "custom" для сжатия
      BACKUP_FORMAT: "plain"

      # Время ожидания (секунды)
      EXECUTE_TIMEOUT: 600

    volumes:
      - ./backups:/backups
      - ./logs/backup:/var/log

    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  backend:
  frontend: