events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Настройки кэширования
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Логирование
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Настройки gzip
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Раздача статических файлов фронтенда
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "public, max-age=3600";
        }


        # Раздача загруженных изображений
        location /images/ {
            # Используем alias вместо root для точного соответствия пути
            alias /usr/share/nginx/images/;

            # Включаем листинг директории (опционально, для отладки)
            autoindex on;

            # Кэширование изображений на клиенте
            expires 30d;
            add_header Cache-Control "public, immutable";

            # Разрешаем CORS если нужно
            add_header Access-Control-Allow-Origin *;

            # Защита от хотлинкинга (опционально)
            # valid_referers none blocked server_names;
            # if ($invalid_referer) {
            #     return 403;
            # }

            # Безопасность: отключаем выполнение скриптов в папке с изображениями
            location ~ \.php$ {
                deny all;
            }
        }

        # API запросы проксируем на бэкенд
        location /api/ {
            proxy_pass http://app:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Увеличенные таймауты для загрузки файлов
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Увеличенный размер буфера для больших файлов
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }

#         # Обработка ошибок
#         error_page 404 /index.html;
#         error_page 500 502 503 504 /50x.html;
#
#         location = /50x.html {
#             root /usr/share/nginx/html;
#         }
    }
}